services:
    app:
        build:
            context: './docker/production'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'openhabit-prod/app'
        restart: unless-stopped
        environment:
            WWWUSER: '${WWWUSER:-1337}'
        volumes:
            - '.:/var/www/html'
        networks:
            - prod
        depends_on:
            pgsql:
                condition: service_healthy
            valkey:
                condition: service_healthy

    caddy:
        image: 'caddy:alpine'
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
            - '443:443/udp'
        environment:
            APP_HOST: '${APP_HOST}'
        volumes:
            - './docker/production/Caddyfile:/etc/caddy/Caddyfile:ro'
            - 'caddy_data:/data'
            - 'caddy_config:/config'
        depends_on:
            - app
        networks:
            - prod

    pgsql:
        image: 'postgres:18-alpine'
        restart: unless-stopped
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'prod-pgsql:/var/lib/postgresql'
        networks:
            - prod
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
            interval: 5s

    valkey:
        image: 'valkey/valkey:alpine'
        restart: unless-stopped
        ports:
            - '127.0.0.1:${FORWARD_VALKEY_PORT:-6379}:6379'
        volumes:
            - 'prod-valkey:/data'
        networks:
            - prod
        healthcheck:
            test:
                - CMD
                - valkey-cli
                - ping
            retries: 3
            timeout: 5s
            interval: 5s

networks:
    prod:
        driver: bridge

volumes:
    prod-pgsql:
        driver: local
    prod-valkey:
        driver: local
    caddy_data:
        driver: local
    caddy_config:
        driver: local
