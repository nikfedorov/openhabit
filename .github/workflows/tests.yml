name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      pgsql:
        image: postgres:18
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sail"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: xdebug

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Install Bun Dependencies
        run: bun install

      - name: Build Assets
        run: bun run build

      - name: Cache Rector
        uses: actions/cache@v4
        with:
          path: /tmp/rector
          key: ${{ runner.os }}-rector-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-rector-

      - name: Cache PHPStan
        uses: actions/cache@v4
        with:
          path: /tmp/phpstan
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-phpstan-

      - name: Create Cache Directories
        run: mkdir -p /tmp/rector /tmp/phpstan

      - name: Create Coverage Directory
        run: mkdir -p coverage

      - name: Tests
        run: composer test-ci
        env:
          DB_HOST: 127.0.0.1

      - name: Extract PHP Coverage
        # if: github.ref == 'refs/heads/main'
        run: |
          PHP_COV=$(php -r "
            \$xml = simplexml_load_file('coverage/clover.xml');
            \$m = \$xml->project->metrics;
            \$total = (int)\$m['statements'];
            \$covered = (int)\$m['coveredstatements'];
            echo \$total > 0 ? round(\$covered / \$total * 100, 1) : 0;
          ")
          echo "PHP_COV=${PHP_COV}" >> $GITHUB_ENV

      - name: Extract Vue Coverage
        # if: github.ref == 'refs/heads/main'
        run: |
          VUE_COV=$(node -e "
            const s = JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json', 'utf8'));
            process.stdout.write(String(s.total.lines.pct));
          ")
          echo "VUE_COV=${VUE_COV}" >> $GITHUB_ENV

      - name: Update PHP Coverage Badge
        # if: github.ref == 'refs/heads/main'
        uses: Schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.GIST_ID }}
          filename: openhabit-php-coverage.json
          label: PHP coverage
          message: ${{ env.PHP_COV }}%
          valColorRange: ${{ env.PHP_COV }}
          maxColorRange: 100
          minColorRange: 0

      - name: Update Vue Coverage Badge
        # if: github.ref == 'refs/heads/main'
        uses: Schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.GIST_ID }}
          filename: openhabit-vue-coverage.json
          label: Vue coverage
          message: ${{ env.VUE_COV }}%
          valColorRange: ${{ env.VUE_COV }}
          maxColorRange: 100
          minColorRange: 0
