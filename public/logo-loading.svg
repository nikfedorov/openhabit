<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Dark background -->
  <rect width="512" height="512" rx="96" fill="#171717"/>

  <!-- Bottom-left: Level 1 (most faded) - pulses first -->
  <rect x="80" y="272" width="160" height="160" rx="24" fill="#14532d">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" begin="0s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom-right: Level 2 - pulses second -->
  <rect x="272" y="272" width="160" height="160" rx="24" fill="#15803d">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Top-left: Level 3 - pulses third -->
  <rect x="80" y="80" width="160" height="160" rx="24" fill="#16a34a">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Top-right: Level 4 (brightest) - pulses last -->
  <rect x="272" y="80" width="160" height="160" rx="24" fill="#22c55e">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
</svg>
